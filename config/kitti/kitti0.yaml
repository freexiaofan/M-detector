dyn_obj:
    points_topic: "/hesai/pandar_points"
    odom_topic: "/chcnav/odom"
    frame_id: "map"
    pc_topic: "/velodyne_points"

    # modify for 128线雷达，主要调整了点云相关参数以适配更高分辨率的雷达数据，同时保持了整体结构和逻辑的一致性。
    dataset: 0 #0 for kitti, 1 for nuscenes, 2 for waymo, 3 for avia
    use_odom_file: true
    stop_object_detect: false
    buffer_delay: 0.1
    buffer_size: 500000  # 128线雷达点云更密集
    points_num_perframe: 320000  # 128线雷达每帧点数更多
    depth_map_dur: 0.1
    max_depth_map_num: 15
    max_pixel_points: 10  # 128线每像素点数增加
    frame_dur: 0.1
    self_x_f: 2.5
    self_x_b: -1.5
    self_y_l: 1.6
    self_y_r: -1.6  # 修正：右侧应该是负值
    blind_dis: 0.3
    fov_up: 20.0  # 128线雷达垂直视场角更大
    fov_down: -43.0  # 适配128线雷达
    fov_left: 180.0
    fov_right: -180.0
    fov_cut: -30  # 减少过度裁剪
    checkneighbor_range: 1
    
    depth_thr1: 0.15
    enter_min_thr1: 1.2  # 降低阈值，提高各方向检测灵敏度
    enter_max_thr1: 0.20  # 适当放宽，避免漏检
    map_cons_depth_thr1: 0.15
    map_cons_hor_thr1: 0.01
    map_cons_ver_thr1: 0.015
    map_cons_hor_dis1: 0.15
    map_cons_ver_dis1: 0.15
    depth_cons_depth_thr1: 0.5
    depth_cons_depth_max_thr1: 1.0
    depth_cons_hor_thr1: 0.01
    depth_cons_ver_thr1: 0.01
    enlarge_z_thr1 : -2.5
    enlarge_angle: 2.0
    enlarge_depth: 3.0
    occluded_map_thr1: 2
    case1_interp_en: true

    v_min_thr2: 1.0
    acc_thr2: 7.0
    map_cons_depth_thr2: 0.2
    map_cons_hor_thr2: 0.01
    map_cons_ver_thr2: 0.01
    occ_depth_thr2: 10.15
    occ_hor_thr2: 0.01
    occ_ver_thr2: 0.015
    depth_cons_depth_thr2: 0.1
    depth_cons_depth_max_thr2: 0.5
    depth_cons_hor_thr2: 0.01
    depth_cons_ver_thr2: 0.01
    occluded_times_thr2: 2
    k_depth2: 0.005
    case2_interp_en: false

    v_min_thr3: 0.5
    acc_thr3: 15.0
    map_cons_depth_thr3: 0.2
    map_cons_hor_thr3: 0.01
    map_cons_ver_thr3: 0.008
    occ_depth_thr3: 0.15
    occ_hor_thr3: 0.01
    occ_ver_thr3: 0.01
    depth_cons_depth_thr3: 0.3
    depth_cons_depth_max_thr3: 1.0
    depth_cons_hor_thr3: 0.01
    depth_cons_ver_thr3: 0.01
    occluding_times_thr3: 2
    case3_interp_en: false

    interp_hor_thr: 0.015
    interp_ver_thr: 0.007
    interp_thr1: 0.5
    interp_static_max: 10.0
    interp_start_depth1: 10
    interp_kp1: 0.1
    interp_kd1: 0.5
    # interp_bg: 0.8
    interp_thr2: 0.25
    interp_thr3: 0.05

    point_index:  -1 
    debug_x: 7.2065
    debug_y: -3.1844
    debug_z: -0.89005

    cluster_coupled: true
    cluster_future: true
    cluster_extend_pixel: 3  # 128线需要更大扩展范围
    cluster_min_pixel_number: 10  # 高分辨率下提高最小像素数
    cluster_thrustable_thresold: 0.28  # 适中的阈值
    cluster_Voxel_revolusion: 0.3
    
    dyn_filter_en: false
    debug_publish: false
   
    ver_resolution_max: 0.003  # 128线雷达需要更精细的垂直分辨率
    hor_resolution_max: 0.003  # 提高水平分辨率以匹配128线
    